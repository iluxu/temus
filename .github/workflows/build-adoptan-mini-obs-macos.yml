name: Build Adoptan Mini OBS for macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "adoptan-mini-obs-v*"
    paths:
      - "apps/AdoptanMiniOBS/**"
      - ".github/workflows/build-adoptan-mini-obs-macos.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          swift --version
          xcodebuild -version

      - name: Resolve dependencies
        working-directory: apps/AdoptanMiniOBS
        run: |
          swift package resolve --scratch-path .build-arm64
          swift package resolve --scratch-path .build-x86_64

      - name: Build the missing Intel SRT runtime
        run: |
          set -o pipefail
          git clone --quiet --depth 1 --branch v1.5.4 \
            https://github.com/Haivision/srt.git \
            "$RUNNER_TEMP/srt-source"
          cmake \
            -S "$RUNNER_TEMP/srt-source" \
            -B "$RUNNER_TEMP/srt-x86-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DENABLE_APPS=OFF \
            -DENABLE_ENCRYPTION=OFF \
            -DENABLE_STDCXX_SYNC=ON \
            2>&1 | tee "$RUNNER_TEMP/srt-x86-build.log"
          cmake --build "$RUNNER_TEMP/srt-x86-build" \
            --config Release \
            --target srt_static \
            --parallel 4 \
            2>&1 | tee -a "$RUNNER_TEMP/srt-x86-build.log"
          srt_archive="$(find "$RUNNER_TEMP/srt-x86-build" \
            -name 'libsrt.a' -print -quit)"
          if [ -z "$srt_archive" ]; then
            echo "::error title=Intel SRT::The native x86_64 SRT archive was not produced"
            exit 1
          fi
          echo "Intel SRT runtime: $srt_archive ($(lipo -archs "$srt_archive"))"
          lipo -verify_arch x86_64 "$srt_archive"

      - name: Expose Intel SRT build errors
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/srt-x86-build.log" ]; then
            details="$(
              grep -Ei \
                'error:|fatal|failed|undefined|make.*\\*\\*\\*' \
                "$RUNNER_TEMP/srt-x86-build.log" | tail -60 || true
            )"
            if [ -z "$details" ]; then
              details="$(tail -30 "$RUNNER_TEMP/srt-x86-build.log")"
            fi
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Intel SRT compiler::$details"
          fi

      - name: Build universal Intel and Apple Silicon executable
        working-directory: apps/AdoptanMiniOBS
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          set -o pipefail
          swift build \
            -c release \
            --product AdoptanMiniOBS \
            --arch arm64 \
            --scratch-path .build-arm64 2>&1 | tee "$RUNNER_TEMP/swift-build-arm64.log"
          srt_archive="$(find "$RUNNER_TEMP/srt-x86-build" \
            -name 'libsrt.a' -print -quit)"
          swift build \
            -c release \
            --product AdoptanMiniOBS \
            --arch x86_64 \
            -Xlinker "$srt_archive" \
            -Xlinker -lc++ \
            --scratch-path .build-x86_64 2>&1 | tee "$RUNNER_TEMP/swift-build-x86_64.log"
          mkdir -p .build/universal
          lipo -create \
            .build-arm64/arm64-apple-macosx/release/AdoptanMiniOBS \
            .build-x86_64/x86_64-apple-macosx/release/AdoptanMiniOBS \
            -output .build/universal/AdoptanMiniOBS
          lipo -verify_arch arm64 x86_64 .build/universal/AdoptanMiniOBS
          lipo -archs .build/universal/AdoptanMiniOBS

      - name: Expose Swift compiler errors
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/swift-build-arm64.log" ] || \
             [ -f "$RUNNER_TEMP/swift-build-x86_64.log" ]; then
            details="$(
              cat \
                "$RUNNER_TEMP"/swift-build-*.log 2>/dev/null | grep -E \
                'Undefined symbols|referenced from:|symbol\\(s\\)|ld:|clang: error|error:' \
                | tail -100 || true
            )"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Swift compiler::$details"
          fi

      - name: Assemble app bundle
        working-directory: apps/AdoptanMiniOBS
        run: |
          APP="$RUNNER_TEMP/Adoptan Mini OBS.app"
          CONTENTS="$APP/Contents"
          mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"
          cp .build/universal/AdoptanMiniOBS "$CONTENTS/MacOS/AdoptanMiniOBS"
          cp Bundle/Info.plist "$CONTENTS/Info.plist"

          ICON_SOURCE="$RUNNER_TEMP/AdoptanMiniOBS-1024.png"
          ICONSET="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$ICONSET"
          swift Bundle/make-icon.swift "$ICON_SOURCE"
          sips -z 16 16 "$ICON_SOURCE" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32 "$ICON_SOURCE" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32 "$ICON_SOURCE" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64 "$ICON_SOURCE" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128 "$ICON_SOURCE" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256 "$ICON_SOURCE" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256 "$ICON_SOURCE" --out "$ICONSET/icon_256x256.png"
          sips -z 512 512 "$ICON_SOURCE" --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512 "$ICON_SOURCE" --out "$ICONSET/icon_512x512.png"
          cp "$ICON_SOURCE" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$CONTENTS/Resources/AppIcon.icns"

          codesign \
            --force \
            --deep \
            --options runtime \
            --sign - \
            --entitlements Bundle/AdoptanMiniOBS.entitlements \
            "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          plutil -lint "$CONTENTS/Info.plist"

      - name: Package and checksum
        run: |
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent \
            "Adoptan Mini OBS.app" \
            "$GITHUB_WORKSPACE/Adoptan-Mini-OBS-macOS.zip"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 Adoptan-Mini-OBS-macOS.zip > Adoptan-Mini-OBS-macOS.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adoptan-Mini-OBS-macOS
          path: |
            Adoptan-Mini-OBS-macOS.zip
            Adoptan-Mini-OBS-macOS.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/adoptan-mini-obs-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Adoptan-Mini-OBS-macOS.zip \
            Adoptan-Mini-OBS-macOS.zip.sha256 \
            --title "Adoptan Mini OBS 0.5.1 — universel Intel et Apple Silicon" \
            --notes "Version universelle native pour les Mac Intel (x86_64) et Apple Silicon (arm64). Elle inclut le mode caméra iPhone SRT via Moblin et les corrections de stabilité ScreenCaptureKit de la version 0.5.0."
