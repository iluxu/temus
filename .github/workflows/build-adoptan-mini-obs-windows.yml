name: Build Adoptan Mini OBS for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "adoptan-mini-obs-windows-v*"
    paths:
      - "apps/AdoptanMiniOBS.Windows/**"
      - ".github/workflows/build-adoptan-mini-obs-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        working-directory: apps/AdoptanMiniOBS.Windows
        run: dotnet restore

      - name: Build
        working-directory: apps/AdoptanMiniOBS.Windows
        run: dotnet build -c Release --no-restore

      - name: Publish self-contained executable
        working-directory: apps/AdoptanMiniOBS.Windows
        run: >
          dotnet publish
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o "$env:RUNNER_TEMP\publish"

      - name: Download FFmpeg Windows build
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract
          $ffmpeg = Get-ChildItem -Path $extract -Recurse -Filter "ffmpeg.exe" |
            Select-Object -First 1
          if (-not $ffmpeg) {
            throw "ffmpeg.exe was not found in the downloaded archive."
          }
          Copy-Item $ffmpeg.FullName (Join-Path $env:RUNNER_TEMP "publish\ffmpeg.exe")
          & (Join-Path $env:RUNNER_TEMP "publish\ffmpeg.exe") -version

      - name: Assemble Windows package
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "Adoptan Mini OBS Windows"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP\publish\AdoptanMiniOBS.exe" $package
          Copy-Item "$env:RUNNER_TEMP\publish\ffmpeg.exe" $package
          Copy-Item "apps\AdoptanMiniOBS.Windows\README.md" $package
          Copy-Item "apps\AdoptanMiniOBS.Windows\THIRD-PARTY-NOTICES.txt" $package
          @"
          ADOPTAN MINI OBS POUR WINDOWS

          1. Double-clique sur AdoptanMiniOBS.exe.
          2. Colle la clé privée adoptan.ai et scanne le QR avec l'iPhone.
          3. Connecte la caméra dans Safari.
          4. Démarre l'aperçu sur Windows.
          5. Ajoute ta clé Kick/Twitch puis lance le direct.

          Garde ffmpeg.exe dans le même dossier que l'application.
          Profil conseillé : 1280x720, 30 images/s, 3500 kb/s.
          "@ | Set-Content -Path (Join-Path $package "COMMENCER ICI.txt") -Encoding UTF8

          Compress-Archive `
            -Path $package `
            -DestinationPath "$env:GITHUB_WORKSPACE\Adoptan-Mini-OBS-Windows-x64.zip" `
            -CompressionLevel Optimal
          $hash = (Get-FileHash `
            "$env:GITHUB_WORKSPACE\Adoptan-Mini-OBS-Windows-x64.zip" `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Adoptan-Mini-OBS-Windows-x64.zip" |
            Set-Content `
              "$env:GITHUB_WORKSPACE\Adoptan-Mini-OBS-Windows-x64.zip.sha256" `
              -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adoptan-Mini-OBS-Windows-x64
          path: |
            Adoptan-Mini-OBS-Windows-x64.zip
            Adoptan-Mini-OBS-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/adoptan-mini-obs-windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "Adoptan-Mini-OBS-Windows-x64.zip" `
            "Adoptan-Mini-OBS-Windows-x64.zip.sha256" `
            --title "Adoptan Mini OBS Windows 0.1.0" `
            --notes "Version Windows native : caméra et micro iPhone via adoptan.ai, capture d'écran, scènes, aperçu, audio et diffusion RTMPS Kick/Twitch."
